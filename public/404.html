<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Found</title>
    <meta http-equiv="refresh" content="0;url=./" />
    <script>
      // SPA fallback for GitHub Pages: redirect unknown routes to index.html
      // while preserving the original path in the query string.
      (function () {
        var l = window.location;
        var base = l.pathname.split('/').slice(0, 2).join('/');
        var newUrl = base + '/?p=' + encodeURIComponent(l.pathname + l.search + l.hash);
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
